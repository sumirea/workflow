name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Day 0: the foundation has no published dependencies or feature code yet, so CI
# is intentionally minimal — it verifies formatting and types only. Lint, build,
# and test steps (and a committed lockfile / frozen install) are enabled
# progressively as packages gain real content.
jobs:
  verify:
    name: Format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck
