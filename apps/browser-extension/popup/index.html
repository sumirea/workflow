<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumirea — Waiting for You</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #555;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .status {
        font-size: 12px;
        margin-top: 12px;
        color: #333;
      }
      .count {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Waiting for You</h1>
    <p>Pings you only when Claude Code Web needs you. It never clicks or approves anything.</p>
    <div class="row">
      <label for="enabled">Enabled</label>
      <input id="enabled" type="checkbox" />
    </div>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
